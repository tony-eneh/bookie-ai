name: bookie_ai
description: "Track nothing. Know everything. Voice-first AI-powered personal finance app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.0.0
  dio: ^5.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  speech_to_text: ^7.0.0
  flutter_tts: ^3.8.5
  fl_chart: ^0.66.0
  permission_handler: ^11.2.0
  intl: ^0.19.0
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^17.0.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  url_launcher: ^6.2.4
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/env/

# App icon: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon.png
  adaptive_icon_background: assets/branding/icon_background.png
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  min_sdk_android: 24

# Launch screen: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1A1B2E"
  image: assets/branding/splash_logo.png
  android_12:
    # Android 12+ masks the splash icon to a circle: use the centred mark.
    color: "#1A1B2E"
    image: assets/branding/icon_foreground.png
    icon_background_color: "#00C9B4"
  ios: false
  web: false
